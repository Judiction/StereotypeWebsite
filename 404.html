    <script>
               // GITHUB PAGES SPA REDIRECT
        //
        // GitHub Pages has no server-side rewrites, so any deep link (e.g.
        // /work/some-project) that isn't a real file gets served this 404
        // page instead. This encodes the requested path into a query string
        // and redirects to the real index.html, which decodes it back into
        // the real pathname (see the inline script there) before router.js
        // ever sees it. This page is never meant to be seen — it redirects
        // in the same tick, before paint — so it intentionally carries none
        // of the site's real markup/CSS/fonts.
        //
        // numFixedSegments = how many leading path segments are the fixed
        // repo base that should be preserved as-is (0 here since this site
        // has a CNAME custom domain and is served from the domain root; a
        // GitHub *project* page like username.github.io/reponame/ would
        // need this set to 1 instead).
        let numFixedSegments = 0;
 
        let loc = window.location;
        const originalPath = loc.pathname;
 
        let pathArray = originalPath.split('/');
 
        let baseArray = pathArray.slice(0, numFixedSegments + 1);
        let routeArray = pathArray.slice(numFixedSegments + 1);
 
        let basePath = baseArray.join('/');
        let route = routeArray.join('/');
 
        let encodedRoute = route.replace(/&/g, "~and~");
 
        let existingSearchQuery = '';
        if (loc.search) {
            let encodedQuery = loc.search.slice('/').replace(/&/g, "~and~");
            existingSearchQuery = '&' + encodedQuery;
        }
 
        let origin = loc.protocol + '//' + loc.hostname;
        if (loc.port) {
            origin = origin + ':' + loc.port;
        }
 
        let redirectUrl = origin + basePath + '/?/' + encodedRoute + existingSearchQuery + loc.hash;
 
        loc.replace(redirectUrl);

    </script>
