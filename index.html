<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>BE A STEREOTYPE</title>
    <meta name="title" content="Judd Buchanan | 3D Artist & Creative Technologist">
    <meta name="description" content="Portfolio of Judd Buchanan, a 3D Artist and Creative Technologist specializing in motion design and interactive visual experiences.">

    <link rel="stylesheet" href="./css/style.css">

</head>
<body>

    <nav id="main-nav"></nav>

    <main id="app">
        <section class="home-hero">
            <div class="hero-content">
                <h1 class="logo">BE A STEREOTYPE</h1>
                <p class="tagline">3D Artist & Creative Technologist</p>
                <p class="intro-phrase">Judd Buchanan</p>
                <a href="/work" class="home-cta">Work</a>
            </div>
        </section>
    </main>

    <script>

        // Para testar o redirecionamento no ambiente de desenvolvimento, utilize o servidor gh_pages_sever.py

        // DECODIFICAR A ROTA (404.html redirect)                           __
        // roda apenas se a rota tiver sido encodada por 404.html (site.com/?/)
        var loc = window.location;

        // verificamos se a rota foi um redirecionamento de 404 (encoded)
        var hasEncodedRoute = loc.search.length > 1 && loc.search[1] === '/';

        if (hasEncodedRoute) {
            // dispensamos com slice o "?/" (2 caracteres), then split on "&" in case an original
            // query string got bundled in alongside our route
            var parts = loc.search.slice(2).split('&');

            // Undo the "&" escaping done on the 404 page
            for (var i = 0; i < parts.length; i++) {
                parts[i] = parts[i].replace(/~and~/g, '&');
            }

            // junta novamente a rota com o originalSearchQuery "route?originalQuery", caso exista search query. caso nao o join() nao coloca nada (array com um item)
            var decodedPath = parts.join('?');

            var basePath = loc.pathname;

            var realUrl = basePath + decodedPath + loc.hash;

            // mudamos o url (que ira consequentemente gerar a pagina correta no main.js)
            window.history.replaceState(null, null, realUrl);
        }
    </script>

    <script type="module" src="/js/app.js"></script>

</body>
</html>
