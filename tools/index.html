<!--
    Casca estatica da rota /tools (mesmo padrao de /about/index.html).

    Como /tools/ e uma pasta real (cada ferramenta mora em uma subpasta, ex.
    /tools/draw-tune/), o Github Pages serve ESTE arquivo quando alguem abre
    beastereotype.com/tools diretamente, sem passar pelo desvio do 404.html.
    Assim que js/app.js carrega, o roteador reconhece a rota "tools" e
    substitui o conteudo de #app pela grade de ferramentas gerada a partir de
    data/projects.js (export const tools).
-->
<body>

    <nav id="main-nav"></nav>

    <main id="app">
        <section class="filterable-page">
            <div class="projects-grid">
                <div class="project-card">
                    <a href="/tools/draw-tune/" target="_blank" rel="noopener noreferrer">
                        <div class="media-container tools">
                            <img src="https://res.cloudinary.com/diizbqlsj/image/upload/v1788728827/cover-tunedraw_zdfyjh.png" alt="Draw Tune">
                        </div>
                        <div class="project-info">
                            <span class="year">2026</span>
                            <h3>Draw Tune</h3>
                            <div class="categories">
                                <span>Interactive</span>
                                <span>Creative Coding</span>
                                <span>Sound</span>
                            </div>
                            <p class="card-description">Draw lines and hear them play. A tempo line sweeps the canvas from left to right: height becomes pitch, colour becomes waveform.</p>
                            <span class="card-launch">Open Tool ↗</span>
                        </div>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="/js/app.js"></script>

</body>
</html>
